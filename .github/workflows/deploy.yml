name: Build and Deploy Flutter Web for Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Web Application
        run: flutter build web --release --base-href /

      - name: Copy Cloudflare Pages & Worker Rules
        run: |
          cp web/_redirects build/web/_redirects || true
          cp web/_headers build/web/_headers || true
          cp web/wrangler.json build/web/wrangler.json || true
          cp web/wrangler.toml build/web/wrangler.toml || true
          cp web/package.json build/web/package.json || true

      - name: Deploy to gh-pages branch (Ready for Cloudflare Pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
